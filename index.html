<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostly Clear — Daily Synoptic Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --climate:    #58697d;
    --weather:    #1a5cc8;
    --renewables: #178a4c;
    --science:    #7a4bd6;
    --industry:   #c07716;
    --alert:      #d92d20;
    --alert-bg:   #fef3f2;
    --alert-line: #fecdca;
    --bg:         #f2f5f9;
    --surface:    #ffffff;
    --ink:        #101828;
    --muted:      #667085;
    --faint:      #98a2b3;
    --border:     #e4e9f0;
    --header-ink: #0b1526;
    --display: 'Space Grotesk', -apple-system, sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--weather); outline-offset: 2px; border-radius: 2px; }

  .masthead { background: var(--header-ink); color: #fff; position: relative; overflow: hidden; }
  .masthead-isolines { position: absolute; inset: 0; opacity: .14; pointer-events: none; }
  .masthead-inner { position: relative; max-width: 1140px; margin: 0 auto; padding: 44px 28px 36px; }
  .masthead-metar { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: #7da2d4; margin-bottom: 10px; }
  .masthead-title { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .masthead-sub { margin-top: 10px; font-size: 14px; color: #9db4d4; max-width: 560px; }

  .controls { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 rgba(16,24,40,.02); }
  .controls-inner { max-width: 1140px; margin: 0 auto; padding: 10px 28px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .window-toggle { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .toggle-btn { font-family: var(--mono); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; padding: 5px 14px; border-radius: 999px; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
  .toggle-btn:hover { color: var(--ink); }
  .toggle-btn.active { background: var(--ink); color: #fff; }
  .nav-pills { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; }
  .nav-pill { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--muted); padding: 4px 2px; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  .nav-pill:hover { color: var(--ink); }
  .np-climate:hover { border-color: var(--climate); }
  .np-weather:hover { border-color: var(--weather); }
  .np-renewables:hover { border-color: var(--renewables); }
  .np-science:hover { border-color: var(--science); }
  .np-industry:hover { border-color: var(--industry); }

  .main { max-width: 1140px; margin: 0 auto; padding: 44px 28px 90px; }
  .digest-section { margin-bottom: 64px; }
  .digest-section:last-of-type { margin-bottom: 0; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .section-swatch { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; display: grid; place-items: center; }
  .section-swatch svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .section-title { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .section-count { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: auto; }
  .s-climate .section-swatch { background: var(--climate); }
  .s-weather .section-swatch { background: var(--weather); }
  .s-renewables .section-swatch { background: var(--renewables); }
  .s-science .section-swatch { background: var(--science); }
  .s-industry .section-swatch { background: var(--industry); }

  .overview { font-size: 15.5px; line-height: 1.7; color: #344054; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 18px; position: relative; }
  .overview::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; }
  .overview a { color: inherit; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
  .s-climate .overview a { color: var(--climate); } .s-climate .overview::before { background: var(--climate); }
  .s-weather .overview a { color: var(--weather); } .s-weather .overview::before { background: var(--weather); }
  .s-renewables .overview a { color: var(--renewables); } .s-renewables .overview::before { background: var(--renewables); }
  .s-science .overview a { color: var(--science); } .s-science .overview::before { background: var(--science); }

  .major-events { background: var(--alert-bg); border: 1px solid var(--alert-line); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .major-events-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alert); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,45,32,.35); } 50% { box-shadow: 0 0 0 6px rgba(217,45,32,0); } }
  .major-events-label { font-family: var(--mono); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--alert); }
  .event { padding: 12px 0; border-top: 1px solid var(--alert-line); display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .event:first-of-type { border-top: none; padding-top: 0; }
  .event:last-of-type { padding-bottom: 0; }
  .event-name { font-family: var(--display); font-weight: 600; font-size: 15.5px; grid-column: 1; }
  .event-status { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--alert); background: #fff; border: 1px solid var(--alert-line); border-radius: 4px; padding: 2px 8px; align-self: start; white-space: nowrap; }
  .event-impact { grid-column: 1 / -1; font-size: 13.5px; color: #7a3a34; }

  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 720px) { .card-grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: box-shadow .18s, transform .18s; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
  .card:hover { box-shadow: 0 4px 16px rgba(16,24,40,.07); transform: translateY(-1px); }
  .card:hover::before { transform: scaleX(1); }
  .s-climate .card::before { background: var(--climate); }
  .s-weather .card::before { background: var(--weather); }
  .s-renewables .card::before { background: var(--renewables); }
  .s-science .card::before { background: var(--science); }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-source { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: #fff; padding: 2.5px 8px; border-radius: 4px; }
  .s-climate .card-source { background: var(--climate); }
  .s-weather .card-source { background: var(--weather); }
  .s-renewables .card-source { background: var(--renewables); }
  .s-science .card-source { background: var(--science); }
  .card-date { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: auto; }
  .card-headline { font-family: var(--display); font-size: 15.5px; font-weight: 600; line-height: 1.35; color: var(--ink); text-decoration: none; }
  .card-headline:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .card-summary { font-size: 13.5px; line-height: 1.55; color: var(--muted); }

  .industry-cards { display: flex; flex-direction: column; gap: 14px; }
  .industry-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; position: relative; overflow: hidden; transition: box-shadow .18s; }
  .industry-card::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: var(--industry); opacity: .35; transition: opacity .2s; }
  .industry-card:hover { box-shadow: 0 4px 16px rgba(16,24,40,.07); }
  .industry-card:hover::before { opacity: 1; }
  .industry-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .industry-title { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .industry-date { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: auto; white-space: nowrap; }
  .industry-body { font-size: 14.5px; line-height: 1.7; color: #344054; margin-bottom: 12px; }
  .industry-body a { color: var(--industry); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .industry-source { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: #fff; background: var(--industry); display: inline-block; padding: 2.5px 9px; border-radius: 4px; }
  .industry-source a { color: #fff; text-decoration: none; }

  .no-results { display: none; font-size: 13.5px; color: var(--faint); font-style: italic; padding: 12px 2px; }
  .no-results.visible { display: block; }
  .card[hidden], .industry-card[hidden] { display: none; }

  .site-footer { border-top: 1px solid var(--border); background: var(--surface); }
  .footer-inner { max-width: 1140px; margin: 0 auto; padding: 32px 28px 48px; }
  .footer-label { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-bottom: 14px; }
  .archive-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
  .archive-list a, .archive-list button { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; transition: border-color .15s, color .15s; background: none; cursor: pointer; }
  .archive-list a:hover, .archive-list button:hover { border-color: var(--ink); color: var(--ink); }
  .footer-credit { margin-top: 28px; font-size: 12.5px; color: var(--faint); }
  .footer-credit a { color: var(--muted); }

  .load-state { max-width: 1140px; margin: 0 auto; padding: 44px 28px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .viewing-archive-banner { max-width: 1140px; margin: 16px auto 0; padding: 0 28px; }
  .viewing-archive-banner div { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .viewing-archive-banner button { font-family: var(--mono); font-size: 11.5px; font-weight: 600; background: var(--ink); color: #fff; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-left: auto; }
</style>
</head>
<body>

<header class="masthead">
  <svg class="masthead-isolines" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20,180 C150,120 280,200 450,150 S760,60 920,110 S1150,180 1240,140" fill="none" stroke="#6a93cc" stroke-width="1.2"/>
    <path d="M-20,140 C160,90 300,160 470,115 S770,30 930,80 S1140,150 1240,105" fill="none" stroke="#6a93cc" stroke-width="1.2"/>
    <path d="M-20,100 C170,60 320,120 490,80 S780,0 940,50 S1130,120 1240,70" fill="none" stroke="#6a93cc" stroke-width="1.2"/>
    <path d="M-20,60 C180,30 340,80 510,45 S790,-30 950,20 S1120,90 1240,35" fill="none" stroke="#6a93cc" stroke-width="1.2"/>
    <circle cx="330" cy="128" r="3" fill="#6a93cc"/>
    <circle cx="860" cy="72" r="3" fill="#6a93cc"/>
  </svg>
  <div class="masthead-inner">
    <div class="masthead-metar" id="metar-line">DIGEST · LOADING…</div>
    <h1 class="masthead-title">Mostly Clear</h1>
    <p class="masthead-sub">Daily synoptic briefing on climate, weather, renewables, research, and the companies building around them.</p>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="window-toggle" role="group" aria-label="Time window">
      <button class="toggle-btn active" data-days="3">72H</button>
      <button class="toggle-btn" data-days="7">7 DAYS</button>
    </div>
    <nav class="nav-pills" aria-label="Sections">
      <a href="#climate" class="nav-pill np-climate">Climate</a>
      <a href="#weather" class="nav-pill np-weather">Weather</a>
      <a href="#renewables" class="nav-pill np-renewables">Renewables</a>
      <a href="#science" class="nav-pill np-science">Science</a>
      <a href="#industry" class="nav-pill np-industry">Industry</a>
    </nav>
  </div>
</div>

<div class="viewing-archive-banner" id="archive-banner" hidden>
  <div>
    <span>Viewing archived issue — <strong id="archive-banner-date"></strong></span>
    <button id="archive-banner-back">Back to latest</button>
  </div>
</div>

<main class="main" id="main-content">
  <div class="load-state" id="load-state">Loading digest…</div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-label">Archive</div>
    <ul class="archive-list" id="archive-list"></ul>
    <p class="footer-credit">Compiled automatically, daily. Curated by <a href="https://iamdrigo.com">Ilya Drigo</a>.</p>
  </div>
</footer>

<script>
(function () {
  var SECTION_META = {
    climate:    { title: 'Climate',           icon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/>' },
    weather:    { title: 'Weather',           icon: '<path d="M4 15a4 4 0 014-4 5 5 0 019.6 1.5A3.5 3.5 0 0117 19H7a4 4 0 01-3-4z"/>' },
    renewables: { title: 'Renewables',        icon: '<path d="M12 3v18M12 8l5-3M12 8L7 5M12 15l5 3M12 15l-5 3"/>' },
    science:    { title: 'Science & Research',icon: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/>' }
  };

  function esc(s) { return (s || '').toString(); } // content is trusted (own generated JSON), inline HTML allowed for links

  function fmtDateShort(iso) {
    var d = new Date(iso + 'T00:00:00Z');
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return d.getUTCDate() + ' ' + months[d.getUTCMonth()];
  }

  function renderCard(sectionKey, item) {
    var extraMeta = item.meta ? '<p class="card-meta">' + esc(item.meta) + '</p>' : '';
    return '<article class="card" data-date="' + esc(item.date) + '">' +
      '<div class="card-top"><span class="card-source">' + esc(item.source) + '</span>' +
      '<span class="card-date">' + fmtDateShort(item.date) + '</span></div>' +
      '<a class="card-headline" href="' + esc(item.url) + '" target="_blank" rel="noopener">' + esc(item.headline) + '</a>' +
      extraMeta +
      '<p class="card-summary">' + esc(item.summary) + '</p>' +
    '</article>';
  }

  function renderIndustryCard(item) {
    return '<article class="industry-card" data-date="' + esc(item.date) + '">' +
      '<div class="industry-top"><h3 class="industry-title">' + esc(item.title) + '</h3>' +
      '<span class="industry-date">' + fmtDateShort(item.date) + '</span></div>' +
      '<p class="industry-body">' + item.body_html + '</p>' +
      '<span class="industry-source">' + item.source_html + '</span>' +
    '</article>';
  }

  function renderSection(key, data) {
    if (!data) return '';
    var meta = SECTION_META[key];
    var html = '<section class="digest-section s-' + key + '" id="' + key + '">';
    html += '<div class="section-head"><span class="section-swatch" aria-hidden="true"><svg viewBox="0 0 24 24">' + meta.icon + '</svg></span>';
    html += '<h2 class="section-title">' + meta.title + '</h2><span class="section-count" data-count-for="' + key + '"></span></div>';

    if (key === 'weather' && data.major_events) {
      html += '<div class="major-events"><div class="major-events-head"><span class="pulse-dot"></span><span class="major-events-label">Major Events</span></div>';
      if (data.major_events.length === 0) {
        html += '<div class="event"><div class="event-name">No major weather events currently active.</div></div>';
      } else {
        data.major_events.forEach(function (ev) {
          html += '<div class="event"><div class="event-name">' + esc(ev.name) + '</div>' +
            '<div class="event-status">' + esc(ev.status) + '</div>' +
            '<div class="event-impact">' + esc(ev.impact) + '</div></div>';
        });
      }
      html += '</div>';
    }

    html += '<div class="overview">' + (data.overview_html || esc(data.overview) || '') + '</div>';

    if (data.items && data.items.length) {
      html += '<div class="card-grid">';
      data.items.forEach(function (item) { html += renderCard(key, item); });
      html += '</div>';
    }
    html += '<p class="no-results" data-empty-for="' + key + '">No items in this window.</p>';
    html += '</section>';
    return html;
  }

  function renderIndustry(data) {
    if (!data) return '';
    var html = '<section class="digest-section" id="industry">';
    html += '<div class="section-head"><span class="section-swatch" aria-hidden="true" style="background:var(--industry)"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg></span>';
    html += '<h2 class="section-title">Industry News</h2><span class="section-count" data-count-for="industry"></span></div>';
    html += '<div class="industry-cards">';
    (data.items || []).forEach(function (item) { html += renderIndustryCard(item); });
    html += '</div>';
    html += '<p class="no-results" data-empty-for="industry">No items in this window.</p>';
    html += '</section>';
    return html;
  }

  function render(data) {
    var main = document.getElementById('main-content');
    var order = ['climate', 'weather', 'renewables', 'science'];
    var html = '';
    order.forEach(function (key) { html += renderSection(key, data.sections[key]); });
    html += renderIndustry(data.sections.industry);
    main.innerHTML = html;

    document.getElementById('metar-line').textContent = data.metar || ('DIGEST ' + data.digest_date);

    applyFilter(getActiveDays());
    document.querySelectorAll('.toggle-btn').forEach(function (btn) {
      btn.onclick = function () {
        document.querySelectorAll('.toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        applyFilter(parseInt(btn.dataset.days, 10));
      };
    });
  }

  function getActiveDays() {
    var active = document.querySelector('.toggle-btn.active');
    return active ? parseInt(active.dataset.days, 10) : 3;
  }

  var currentDigestDate = null;

  function applyFilter(days) {
    if (!currentDigestDate) return;
    var cutoff = currentDigestDate - days * 86400000;
    ['climate', 'weather', 'renewables', 'science', 'industry'].forEach(function (sec) {
      var cards = document.querySelectorAll('#' + sec + ' .card, #' + sec + ' .industry-card');
      var visible = 0;
      cards.forEach(function (card) {
        var d = new Date(card.dataset.date + 'T00:00:00Z').getTime();
        var show = d >= cutoff;
        card.hidden = !show;
        if (show) visible++;
      });
      var empty = document.querySelector('[data-empty-for="' + sec + '"]');
      if (empty) empty.classList.toggle('visible', visible === 0 && cards.length > 0);
      var count = document.querySelector('[data-count-for="' + sec + '"]');
      if (count) count.textContent = visible + (visible === 1 ? ' item' : ' items');
    });
  }

  function renderArchiveList(dates, activeDate) {
    var ul = document.getElementById('archive-list');
    ul.innerHTML = '';
    dates.forEach(function (d) {
      if (d === activeDate) return;
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.textContent = d;
      btn.onclick = function () { loadDigest(d); history.pushState({}, '', '?d=' + d); };
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function showArchiveBanner(date, isArchive) {
    var banner = document.getElementById('archive-banner');
    if (isArchive) {
      document.getElementById('archive-banner-date').textContent = date;
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }
  document.getElementById('archive-banner-back').onclick = function () {
    history.pushState({}, '', location.pathname);
    loadDigest(null);
  };

  function loadDigest(date) {
    var url = date ? ('data/archive/' + date + '.json') : 'data/latest.json';
    document.getElementById('main-content').innerHTML = '<div class="load-state" id="load-state">Loading digest…</div>';
    fetch(url, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(function (data) {
        currentDigestDate = new Date(data.digest_date + 'T00:00:00Z').getTime();
        render(data);
        showArchiveBanner(data.digest_date, !!date);
        return fetch('data/archive-index.json', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (dates) { renderArchiveList(dates, data.digest_date); })
          .catch(function () {});
      })
      .catch(function (err) {
        document.getElementById('main-content').innerHTML =
          '<div class="load-state">Could not load the digest' + (date ? (' for ' + date) : '') + '. <a href="' + location.pathname + '">Back to latest</a></div>';
      });
  }

  var params = new URLSearchParams(location.search);
  var requestedDate = params.get('d');
  loadDigest(requestedDate);
})();
</script>

</body>
</html>
